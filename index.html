<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stremio — Everything you watch. One app.</title>
    <meta
      name="description"
      content="Stremio brings every movie, series and channel you love into one beautiful app. Free forever, on every screen. Portfolio demo page."
    />

    <!-- Icons. The SVG is used by modern browsers; PNGs are the fallback. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon-180.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#f2ece1" />
    <meta name="color-scheme" content="light" />

    <!-- Social previews. Set BASE_URL to the deployed origin: og:image must be
         an absolute URL for most scrapers to resolve it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stremio (demo)" />
    <meta property="og:title" content="Stremio — Everything you watch. One app." />
    <meta
      property="og:description"
      content="Films, series, live channels and your own library in a single free app — on desktop, mobile, smart TV and the web."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Stremio play mark on a dark background." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stremio — Everything you watch. One app." />
    <meta
      name="twitter:description"
      content="Films, series, live channels and your own library in a single free app — on desktop, mobile, smart TV and the web."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo is requested at two widths: 75% for display copy, 100% for the
         uppercase labels. Source Serif 4 carries all running text. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75,500;75,600;75,700;75,800;100,500;100,600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
