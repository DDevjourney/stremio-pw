<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Stremio — Everything you watch. One app.</title>
    <meta
      name="description"
      content="Stremio brings every movie, series and channel you love into one beautiful app. Free forever, on every screen. Portfolio demo page."
    />

    <!-- Icons. The SVG is used by modern browsers; PNGs are the fallback. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon-180.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#1f2a2e" />
    <meta name="color-scheme" content="dark" />

    <!-- Social previews. These URLs are absolute on purpose: most scrapers will
         not resolve a root-relative og:image, and Vite does not rewrite `content`
         attributes the way it rewrites `href`/`src`, so a relative path here
         would also miss the /stremio-pw/ base. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stremio (demo)" />
    <meta property="og:title" content="Stremio — Everything you watch. One app." />
    <meta
      property="og:description"
      content="Films, series, live channels and your own library in a single free app — on desktop, mobile, smart TV and the web."
    />
    <meta property="og:image" content="https://ddevjourney.github.io/stremio-pw/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Stremio play mark on a dark background." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stremio — Everything you watch. One app." />
    <meta
      name="twitter:description"
      content="Films, series, live channels and your own library in a single free app — on desktop, mobile, smart TV and the web."
    />
    <meta name="twitter:image" content="https://ddevjourney.github.io/stremio-pw/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Space Grotesk sets panel display copy; IBM Plex Mono carries every label,
         port ID and table value; IBM Plex Sans carries running text. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
